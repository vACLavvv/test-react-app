image: node:24.16-alpine

stages:
  - build
  - test

install_dependencies:
  stage: build
  tags:
    - react
  script:
    - yarn install
  cache:
    paths:
      - node_modules
    key:
      files:
        - yarn.lock
run_tests:
  stage: test
  tags:
    - react
  script: 
    - CI=true yarn test


